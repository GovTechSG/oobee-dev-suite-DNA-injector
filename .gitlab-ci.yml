# Pin the included CI config to an immutable commit SHA (or protected tag) in
# the upstream oobee-web-infra project rather than the mutable `master` branch.
# `.aws-vars` is spliced into publish_npm (holds NPM_TOKEN) and
# publish_codeartifact (holds AWS_* CodeArtifact credentials), so anyone able
# to push to that upstream default branch could otherwise alter what runs
# inside our credential-bearing jobs without any review on this repository.
#
# The pinned value lives in the GitLab CI/CD variable OOBEE_WEB_INFRA_INCLUDE_REF
# (protected + masked). To rotate: `git ls-remote https://...oobee-web-infra
# refs/heads/master`, then update the variable in Settings > CI/CD > Variables.
# The variable expansion in `ref:` is supported by GitLab >= 16.0.
include:
  - project: "wog/gvt/wogaa/projects/oobee/oobee-web-infra"
    ref: $OOBEE_WEB_INFRA_INCLUDE_REF
    file:
      - "gitlab-template/vars/.aws-gitlab-keys.yml"

stages:
  - pin-check
  - validate
  - publish

# Base image is pinned via the GitLab CI/CD variable BASE_IMAGE_REF (protected)
# so DevOps can rotate the digest without touching this file. Set it to the
# form `...alpine-3.19-node-22@sha256:<digest>` — never a mutable `:latest`
# tag. Rotate by running `crane digest <image>:<intended-version>` against the
# internal registry, then update the variable. The check_pin job below rejects
# any value that still contains a mutable indicator so the safety-net catches
# a misconfigured rotation.
image: $BASE_IMAGE_REF

variables:
  ENV: 
    value: "nprod"
    options:
      - "nprod"
      - "prod"
  NPM_CONFIG_AUDIT: "false"
  NPM_CONFIG_FUND: "false"

workflow:
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "web"
    - if: $CI_COMMIT_BRANCH == "develop"

.dev-variables:
  variables: !reference [.aws-vars, ci]
.prd-variables:
  variables: !reference [.aws-vars, prd]

.development-trigger-rule:
  environment: development
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - if: $CI_COMMIT_BRANCH == "develop"
    - if: $ENV == "nprod"

.production-trigger-rule:
  allow_failure: false
  environment: production
  rules:
    # `when: manual` on the tag rule so publishing to public npm still requires
    # an explicit approval click even when a tag is pushed. Without this, any
    # actor with tag-creation rights (a broader set than release managers)
    # could trigger a supply-chain publish. Pair with GitLab protected tags to
    # narrow who can create the triggering tag in the first place.
    - if: '$CI_COMMIT_TAG'
      when: manual
    - if: $ENV == "prod"
      when: manual

# Refuse to run any downstream stage if the pinned values look mutable. This
# is a defense-in-depth check for the case where a DevOps rotation
# accidentally sets OOBEE_WEB_INFRA_INCLUDE_REF back to `master`/`main` or
# BASE_IMAGE_REF back to a `:latest`-style tag. The include: itself is
# resolved before this job runs, but the credential-bearing publish jobs are
# `needs`-gated on pack_check, which is `needs`-gated on this pin_check.
pin_check:
  stage: pin-check
  script:
    - |
      set -eu
      : "${OOBEE_WEB_INFRA_INCLUDE_REF:?OOBEE_WEB_INFRA_INCLUDE_REF must be set (Settings > CI/CD > Variables)}"
      : "${BASE_IMAGE_REF:?BASE_IMAGE_REF must be set (Settings > CI/CD > Variables)}"
      case "$OOBEE_WEB_INFRA_INCLUDE_REF" in
        master|main|HEAD|develop|latest)
          echo "Refusing mutable OOBEE_WEB_INFRA_INCLUDE_REF=$OOBEE_WEB_INFRA_INCLUDE_REF; pin to a commit SHA or protected tag." >&2
          exit 1
          ;;
      esac
      case "$BASE_IMAGE_REF" in
        *:latest|*:main|*:master|*[!@]sha256:*)
          echo "Refusing mutable BASE_IMAGE_REF=$BASE_IMAGE_REF; pin as ...@sha256:<digest>." >&2
          exit 1
          ;;
      esac
      case "$BASE_IMAGE_REF" in
        *@sha256:[0-9a-f]*) : ;;
        *)
          echo "BASE_IMAGE_REF=$BASE_IMAGE_REF is not in @sha256:<digest> form." >&2
          exit 1
          ;;
      esac

pack_check:
  stage: validate
  needs:
    - pin_check
  before_script:
    - cd oobee-genome
  script:
    - npm run pack:check
  
publish_codeartifact:
  stage: publish
  needs:
    - pack_check
  before_script:
    - cd oobee-genome
    # `npm ci --ignore-scripts` in publish jobs so a malicious transitive
    # dependency cannot run preinstall/install/postinstall/prepare scripts
    # while AWS_* CodeArtifact publish credentials are present in the job env.
    - npm ci --ignore-scripts
  script:
    - |
      : "Required variables: AWS_DEFAULT_REGION, AWS_ACCOUNT_ID, AWS_CODEARTIFACT_DOMAIN, AWS_CODEARTIFACT_REPOSITORY"
      aws codeartifact login \
        --tool npm \
        --domain "$AWS_CODEARTIFACT_DOMAIN" \
        --domain-owner "$AWS_ACCOUNT_ID" \
        --repository "$AWS_CODEARTIFACT_REPOSITORY" \
        --region "$AWS_DEFAULT_REGION"
    - npm publish
  extends:
    - .development-trigger-rule
    - .dev-variables

publish_npm:
  stage: publish
  needs:
    - pack_check
  before_script:
    - cd oobee-genome
    # `npm ci --ignore-scripts` in publish jobs so a malicious transitive
    # dependency cannot run preinstall/install/postinstall/prepare scripts
    # while NPM_TOKEN is present in the job env.
    - npm ci --ignore-scripts
  script:
    - echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
    - npm config set @oobee:registry https://registry.npmjs.org/
    - npm publish --access public --registry https://registry.npmjs.org/
  extends:
    - .production-trigger-rule
