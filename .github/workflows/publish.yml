name: Publish Package to npmjs
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Commit to publish: "master" or a SHA already on master. The package.json version in oobee-genome/ is what lands on npm.'
        required: true
        type: string
        default: master
# No job gets write access by default; only the gated publish job is granted
# contents:write / id-token:write below.
permissions: {}
jobs:
  build:
    # Pin the runner to a specific Ubuntu version rather than the mutable
    # `ubuntu-latest` label. `ubuntu-latest` silently rolls forward whenever
    # GitHub promotes a new image, which changes the tooling baseline (Node,
    # openssl, curl, git) underneath a credential-bearing publish job.
    runs-on: ubuntu-24.04
    # Installs and packs code from the chosen ref, so it holds no secrets and
    # only read access.
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.ref.outputs.sha }}
      version: ${{ steps.pack.outputs.version }}
    defaults:
      run:
        working-directory: oobee-genome
    steps:
      # Third-party GitHub Actions are pinned to a full commit SHA rather than
      # the mutable `@v4` tag. The publish job holds `id-token: write`
      # for provenance signing, so a repointed `v4` tag would land
      # attacker-controlled JavaScript inside a credential-bearing step.
      # Update the SHA + trailing version comment together at each intended
      # action refresh — never bump the version comment on its own.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0
          persist-credentials: false

      # Only reviewed code may ship. The workflow file itself is taken from the
      # dispatch branch, so that must be the default branch too; otherwise an
      # edited copy of this file on a feature branch could skip these checks.
      - name: Verify dispatch branch and ref are on the default branch
        id: ref
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          DISPATCH_REF: ${{ github.ref }}
        run: |
          if [ "$DISPATCH_REF" != "refs/heads/${DEFAULT_BRANCH}" ]; then
            echo "::error::Run this workflow from ${DEFAULT_BRANCH}, not ${DISPATCH_REF}."
            exit 1
          fi
          SHA=$(git rev-parse HEAD)
          if ! git merge-base --is-ancestor "$SHA" "origin/${DEFAULT_BRANCH}"; then
            echo "::error::${SHA} is not on ${DEFAULT_BRANCH}; refusing to publish unreviewed code."
            exit 1
          fi
          echo "sha=${SHA}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'

      - run: npm ci --ignore-scripts
        continue-on-error: false

      - name: Pack tarball
        id: pack
        run: |
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/pkg"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/pkg"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    # Protected environment: required reviewers and deployments limited to the
    # default branch. npm trusted publishing is bound to this workflow file and
    # environment, so no long-lived npm token exists to leak.
    environment: npm-publish
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.build.outputs.sha }}

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.x'
          registry-url: 'https://registry.npmjs.org'

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package
          path: ${{ runner.temp }}/pkg

      # Trusted publishing (OIDC) needs npm >= 11.5.1; provenance is automatic.
      - name: Install npm with trusted publishing support
        run: npm install -g npm@11.6.2 --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --ignore-scripts "$RUNNER_TEMP"/pkg/*.tgz

      # Tag only after npm accepted the version (npm rejects duplicates). Version
      # tags are never force-pushed, so a release tag can't be rewritten; only
      # the moving `latest` pointer is.
      - name: Create and push git tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${VERSION}" -m "Version ${VERSION}"
          git push origin "refs/tags/${VERSION}"
          git tag -af "latest" -m "Latest release ${VERSION}"
          git push origin "refs/tags/latest" --force
